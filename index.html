<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meus Links</title>
  <meta name="description" content="Todos os meus links em um só lugar">
  <meta name="theme-color" content="#0f0f14">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!--
    =====================================================================
    CONFIGURAÇÃO PADRÃO DO CLIENTE
    ---------------------------------------------------------------------
    Duas formas de usar este modelo:

    1) UMA PÁGINA POR CLIENTE: copie esta pasta e edite o objeto abaixo.

    2) VÁRIOS CLIENTES NO MESMO SITE: crie um arquivo em
       clientes/<apelido>.json (veja clientes/exemplo.json) e grave no
       chaveiro a URL:  https://seusite.com/?c=<apelido>
       O JSON substitui os valores abaixo.

    Deixe vazio ("") ou apague qualquer campo que o cliente não usar —
    o botão correspondente simplesmente não aparece.
    =====================================================================
  -->
  <script>
    window.CLIENTE = {
      nome: "Nome do Cliente",
      descricao: "Profissão • Cidade/UF\nFrase curta sobre o negócio",
      foto: "img/avatar.svg",          // caminho ou URL da foto (quadrada)
      cor: "#7c3aed",                  // cor principal do cliente
      tema: "escuro",                  // "escuro" ou "claro"

      whatsapp: {
        numero: "5511999999999",       // DDI + DDD + número, só dígitos
        mensagem: "Olá! Vim pelo seu chaveiro e gostaria de mais informações."
      },

      pix: {
        chave: "email@exemplo.com",    // CPF, CNPJ, e-mail, celular (+55...) ou chave aleatória
        nome: "Nome do Cliente",       // nome do recebedor (aparece no app do banco)
        cidade: "Sao Paulo",
        valor: "",                     // opcional, ex: "25.00" — vazio = pagador digita
        descricao: ""                  // opcional
      },

      email: "contato@exemplo.com",
      telefone: "+5511999999999",
      site: "https://exemplo.com",

      google: {
        avaliar: "https://g.page/r/SEU_CODIGO/review", // link "Pedir avaliações" do Perfil da Empresa
        maps: "https://maps.app.goo.gl/SEU_CODIGO",
        perfil: ""                                     // link do Perfil da Empresa no Google
      },

      // Basta o @usuario (sem @) ou a URL completa
      redes: {
        instagram: "usuario",
        facebook: "usuario",
        tiktok: "usuario",
        youtube: "usuario",
        linkedin: "usuario",
        x: "",
        threads: "",
        kwai: "",
        pinterest: "",
        telegram: "",
        spotify: "",
        twitch: "",
        discord: "",
        snapchat: "",
        behance: "",
        github: ""
      },

      // Botões livres: cardápio, catálogo, agenda, portfólio, loja...
      extras: [
        { titulo: "Ver catálogo", url: "https://exemplo.com/catalogo", icone: "fa-solid fa-book-open" },
        { titulo: "Agendar horário", url: "https://exemplo.com/agenda", icone: "fa-solid fa-calendar-check" }
      ],

      mostrarSalvarContato: true,
      mostrarCompartilhar: true
    };
  </script>

  <style>
    :root {
      --cor: #7c3aed;
      --bg: #0f0f14;
      --bg2: #1b1b24;
      --card: rgba(255, 255, 255, .06);
      --card-hover: rgba(255, 255, 255, .11);
      --borda: rgba(255, 255, 255, .10);
      --texto: #f5f5f7;
      --texto2: #a8a8b3;
    }
    body.claro {
      --bg: #f4f4f7;
      --bg2: #ffffff;
      --card: #ffffff;
      --card-hover: #f0f0f5;
      --borda: rgba(0, 0, 0, .08);
      --texto: #18181b;
      --texto2: #5f5f6b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      background-image: radial-gradient(circle at 50% -10%, color-mix(in srgb, var(--cor) 45%, transparent) 0, transparent 55%);
      background-attachment: fixed;
      color: var(--texto);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px calc(32px + env(safe-area-inset-bottom));
    }
    main { width: 100%; max-width: 480px; }

    .topo { text-align: center; margin-bottom: 24px; }
    .avatar {
      width: 112px; height: 112px; border-radius: 50%; object-fit: cover;
      border: 3px solid var(--cor);
      box-shadow: 0 0 0 6px color-mix(in srgb, var(--cor) 25%, transparent);
      background: var(--bg2);
    }
    h1 { font-size: 1.45rem; font-weight: 700; margin-top: 14px; }
    .descricao { color: var(--texto2); font-size: .92rem; margin-top: 6px; white-space: pre-line; line-height: 1.5; }

    .redes { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 20px 0 26px; }
    .rede {
      width: 46px; height: 46px; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--card); border: 1px solid var(--borda);
      color: var(--texto); font-size: 1.2rem; text-decoration: none;
      transition: transform .15s, background .15s, color .15s;
    }
    .rede:hover, .rede:focus-visible { transform: translateY(-3px); background: var(--cor); color: #fff; }

    .botoes { display: flex; flex-direction: column; gap: 12px; }
    .botao {
      display: flex; align-items: center; gap: 14px;
      width: 100%; padding: 14px 18px; border-radius: 16px;
      background: var(--card); border: 1px solid var(--borda);
      color: var(--texto); text-decoration: none; font: inherit; font-weight: 500; font-size: .98rem;
      cursor: pointer; text-align: left;
      transition: transform .15s, background .15s;
      backdrop-filter: blur(8px);
    }
    .botao:hover, .botao:focus-visible { background: var(--card-hover); transform: scale(1.015); }
    .botao .ic {
      width: 40px; height: 40px; flex: none; border-radius: 12px;
      display: grid; place-items: center; font-size: 1.2rem; color: #fff;
      background: var(--cor);
    }
    .botao .tx { flex: 1; min-width: 0; }
    .botao small { display: block; color: var(--texto2); font-weight: 400; font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .botao .seta { color: var(--texto2); font-size: .85rem; }

    .botao.whatsapp .ic { background: #25d366; }
    .botao.pix .ic      { background: #32bcad; }
    .botao.google .ic   { background: #fff; color: #4285f4; border: 1px solid var(--borda); }
    .botao.maps .ic     { background: #ea4335; }
    .botao.email .ic    { background: #f59e0b; }
    .botao.telefone .ic { background: #3b82f6; }

    .acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
    .acoes .botao { justify-content: center; font-size: .9rem; padding: 12px; }
    .acoes .botao:only-child { grid-column: 1 / -1; }

    footer { text-align: center; color: var(--texto2); font-size: .75rem; margin-top: 34px; opacity: .8; }

    /* Modal Pix */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-end; justify-content: center; z-index: 10; padding: 16px; }
    .modal.aberto { display: flex; }
    .modal-caixa {
      width: 100%; max-width: 420px; background: var(--bg2); color: var(--texto);
      border-radius: 22px; padding: 24px 20px; text-align: center;
      border: 1px solid var(--borda); animation: sobe .2s ease-out;
    }
    @keyframes sobe { from { transform: translateY(30px); opacity: 0; } }
    @media (min-width: 600px) { .modal { align-items: center; } }
    .modal h2 { font-size: 1.15rem; }
    .modal p { color: var(--texto2); font-size: .85rem; margin-top: 4px; }
    #qrPix { background: #fff; padding: 12px; border-radius: 14px; display: inline-block; margin: 18px 0 14px; }
    #qrPix img, #qrPix canvas { display: block; width: 200px; height: 200px; }
    .chave { background: var(--card); border: 1px solid var(--borda); border-radius: 12px; padding: 10px 12px; font-size: .85rem; word-break: break-all; margin-bottom: 12px; }
    .modal .botao { justify-content: center; margin-top: 8px; }
    .modal .botao.principal { background: #32bcad; color: #fff; border: none; }
    .fechar { background: none; border: none; color: var(--texto2); font: inherit; margin-top: 14px; cursor: pointer; text-decoration: underline; }

    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
      background: #18181b; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: .88rem;
      opacity: 0; transition: .25s; pointer-events: none; z-index: 20;
    }
    .toast.ver { opacity: 1; transform: translate(-50%, 0); }

    .erro { text-align: center; color: var(--texto2); margin-top: 30vh; }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <div class="modal" id="modalPix" role="dialog" aria-modal="true" aria-labelledby="pixTitulo">
    <div class="modal-caixa">
      <h2 id="pixTitulo"><i class="fa-brands fa-pix"></i> Pagar com Pix</h2>
      <p id="pixRecebedor"></p>
      <div id="qrPix"></div>
      <div class="chave" id="pixChave"></div>
      <button class="botao principal" id="copiarCopiaCola"><i class="fa-regular fa-copy"></i> Copiar Pix Copia e Cola</button>
      <button class="botao" id="copiarChave"><i class="fa-solid fa-key"></i> Copiar só a chave</button>
      <button class="fechar" id="fecharPix">Fechar</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
  (function () {
    "use strict";

    // ---------- Redes sociais: ícone + como montar a URL a partir do usuário ----------
    var REDES = {
      instagram: { nome: "Instagram", icone: "fa-brands fa-instagram", url: "https://instagram.com/{u}" },
      facebook:  { nome: "Facebook",  icone: "fa-brands fa-facebook-f", url: "https://facebook.com/{u}" },
      tiktok:    { nome: "TikTok",    icone: "fa-brands fa-tiktok",    url: "https://tiktok.com/@{u}" },
      youtube:   { nome: "YouTube",   icone: "fa-brands fa-youtube",   url: "https://youtube.com/@{u}" },
      linkedin:  { nome: "LinkedIn",  icone: "fa-brands fa-linkedin-in", url: "https://linkedin.com/in/{u}" },
      x:         { nome: "X (Twitter)", icone: "fa-brands fa-x-twitter", url: "https://x.com/{u}" },
      threads:   { nome: "Threads",   icone: "fa-brands fa-threads",   url: "https://threads.net/@{u}" },
      kwai:      { nome: "Kwai",      icone: "fa-solid fa-video",      url: "https://kwai.com/@{u}" },
      pinterest: { nome: "Pinterest", icone: "fa-brands fa-pinterest-p", url: "https://pinterest.com/{u}" },
      telegram:  { nome: "Telegram",  icone: "fa-brands fa-telegram",  url: "https://t.me/{u}" },
      spotify:   { nome: "Spotify",   icone: "fa-brands fa-spotify",   url: "https://open.spotify.com/user/{u}" },
      twitch:    { nome: "Twitch",    icone: "fa-brands fa-twitch",    url: "https://twitch.tv/{u}" },
      discord:   { nome: "Discord",   icone: "fa-brands fa-discord",   url: "https://discord.gg/{u}" },
      snapchat:  { nome: "Snapchat",  icone: "fa-brands fa-snapchat",  url: "https://snapchat.com/add/{u}" },
      behance:   { nome: "Behance",   icone: "fa-brands fa-behance",   url: "https://behance.net/{u}" },
      github:    { nome: "GitHub",    icone: "fa-brands fa-github",    url: "https://github.com/{u}" }
    };

    // ---------- Utilitários ----------
    function el(tag, attrs, filhos) {
      var e = document.createElement(tag);
      Object.keys(attrs || {}).forEach(function (k) {
        if (k === "class") e.className = attrs[k];
        else if (k === "text") e.textContent = attrs[k];
        else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), attrs[k]);
        else e.setAttribute(k, attrs[k]);
      });
      (filhos || []).forEach(function (f) { if (f) e.appendChild(f); });
      return e;
    }
    function icone(classes) { return el("i", { class: classes, "aria-hidden": "true" }); }
    function soDigitos(s) { return String(s || "").replace(/\D/g, ""); }
    function urlSegura(u) { return /^(https?:|mailto:|tel:)/i.test(u) ? u : "#"; }

    function linkRede(chave, valor) {
      if (!valor) return null;
      if (/^https?:\/\//i.test(valor)) return valor;
      return REDES[chave].url.replace("{u}", encodeURIComponent(String(valor).replace(/^@/, "")));
    }

    function avisar(msg) {
      var t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("ver");
      clearTimeout(avisar._t);
      avisar._t = setTimeout(function () { t.classList.remove("ver"); }, 2200);
    }

    function copiar(texto, msg) {
      function fallback() {
        var a = el("textarea", { readonly: "" });
        a.value = texto;
        a.style.position = "fixed"; a.style.opacity = "0";
        document.body.appendChild(a); a.select();
        try { document.execCommand("copy"); } catch (e) {}
        a.remove();
      }
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(texto).catch(fallback);
      } else fallback();
      avisar(msg || "Copiado!");
    }

    // ---------- Pix: gera o "Pix Copia e Cola" (BR Code estático, padrão Banco Central) ----------
    function semAcento(s) {
      return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9 .,\-]/g, "").trim();
    }
    function campo(id, valor) {
      valor = String(valor);
      return id + String(valor.length).padStart(2, "0") + valor;
    }
    function crc16(payload) {
      var crc = 0xFFFF;
      for (var i = 0; i < payload.length; i++) {
        crc ^= payload.charCodeAt(i) << 8;
        for (var j = 0; j < 8; j++) {
          crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
          crc &= 0xFFFF;
        }
      }
      return crc.toString(16).toUpperCase().padStart(4, "0");
    }
    function gerarPix(p) {
      var chave = String(p.chave || "").trim();
      // Celular precisa estar no formato +55DDDNUMERO; CPF/CNPJ só dígitos
      if (/^\+?\d[\d\s().-]{9,}$/.test(chave) && chave.indexOf("@") < 0) {
        var d = soDigitos(chave);
        if (chave.charAt(0) === "+") chave = "+" + d;
        else if (d.length === 11 || d.length === 14) chave = d; // CPF ou CNPJ
        else chave = "+55" + d;
      }
      var conta = campo("00", "br.gov.bcb.pix") + campo("01", chave);
      var desc = semAcento(p.descricao).slice(0, 40);
      if (desc) conta += campo("02", desc);

      var payload =
        campo("00", "01") +
        campo("26", conta) +
        campo("52", "0000") +
        campo("53", "986") +
        (p.valor ? campo("54", Number(String(p.valor).replace(",", ".")).toFixed(2)) : "") +
        campo("58", "BR") +
        campo("59", (semAcento(p.nome) || "Recebedor").slice(0, 25)) +
        campo("60", (semAcento(p.cidade) || "Brasil").slice(0, 15)) +
        campo("62", campo("05", "***")) +
        "6304";
      return payload + crc16(payload);
    }

    function abrirPix(p) {
      var codigo = gerarPix(p);
      document.getElementById("pixRecebedor").textContent = p.nome ? "Recebedor: " + p.nome : "";
      document.getElementById("pixChave").textContent = "Chave: " + p.chave;
      var qr = document.getElementById("qrPix");
      qr.innerHTML = "";
      if (window.QRCode) {
        new QRCode(qr, { text: codigo, width: 400, height: 400, correctLevel: QRCode.CorrectLevel.M });
      } else {
        qr.style.display = "none";
      }
      document.getElementById("copiarCopiaCola").onclick = function () { copiar(codigo, "Pix Copia e Cola copiado! Cole no app do banco."); };
      document.getElementById("copiarChave").onclick = function () { copiar(p.chave, "Chave Pix copiada!"); };
      document.getElementById("modalPix").classList.add("aberto");
    }
    function fecharPix() { document.getElementById("modalPix").classList.remove("aberto"); }
    document.getElementById("fecharPix").addEventListener("click", fecharPix);
    document.getElementById("modalPix").addEventListener("click", function (e) { if (e.target === this) fecharPix(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") fecharPix(); });

    // ---------- Salvar contato (.vcf) ----------
    function salvarContato(c) {
      function esc(s) { return String(s || "").replace(/([,;\\])/g, "\\$1").replace(/\n/g, "\\n"); }
      var linhas = ["BEGIN:VCARD", "VERSION:3.0", "FN:" + esc(c.nome), "N:" + esc(c.nome) + ";;;;"];
      if (c.telefone) linhas.push("TEL;TYPE=CELL:" + c.telefone);
      if (c.whatsapp && c.whatsapp.numero && c.whatsapp.numero !== soDigitos(c.telefone))
        linhas.push("TEL;TYPE=WHATSAPP:+" + soDigitos(c.whatsapp.numero));
      if (c.email) linhas.push("EMAIL:" + c.email);
      if (c.site) linhas.push("URL:" + c.site);
      linhas.push("URL:" + location.href);
      if (c.descricao) linhas.push("NOTE:" + esc(c.descricao));
      linhas.push("END:VCARD");
      var blob = new Blob([linhas.join("\r\n")], { type: "text/vcard;charset=utf-8" });
      var a = el("a", { href: URL.createObjectURL(blob), download: (semAcento(c.nome) || "contato") + ".vcf" });
      document.body.appendChild(a); a.click(); a.remove();
    }

    // ---------- Montagem da página ----------
    function botao(classe, iconeClasses, titulo, subtitulo, href, aoClicar) {
      var filhos = [
        el("span", { class: "ic" }, [icone(iconeClasses)]),
        el("span", { class: "tx" }, [document.createTextNode(titulo), subtitulo ? el("small", { text: subtitulo }) : null]),
        icone("fa-solid fa-chevron-right seta")
      ];
      if (href) {
        var externo = /^https?:/i.test(href);
        return el("a", { class: "botao " + classe, href: urlSegura(href), target: externo ? "_blank" : null, rel: externo ? "noopener" : null }, filhos);
      }
      return el("button", { class: "botao " + classe, type: "button", onclick: aoClicar }, filhos);
    }

    function render(c) {
      document.title = c.nome || "Meus Links";
      document.documentElement.style.setProperty("--cor", c.cor || "#7c3aed");
      document.body.style.setProperty("--cor", c.cor || "#7c3aed");
      if (c.tema === "claro") document.body.classList.add("claro");

      var app = document.getElementById("app");
      app.innerHTML = "";

      // Topo
      app.appendChild(el("header", { class: "topo" }, [
        c.foto ? el("img", { class: "avatar", src: c.foto, alt: "Foto de " + (c.nome || "") }) : null,
        el("h1", { text: c.nome || "" }),
        c.descricao ? el("p", { class: "descricao", text: c.descricao }) : null
      ]));

      // Ícones das redes sociais
      var redes = el("nav", { class: "redes", "aria-label": "Redes sociais" });
      Object.keys(REDES).forEach(function (k) {
        var url = linkRede(k, (c.redes || {})[k]);
        if (url) redes.appendChild(el("a", { class: "rede", href: urlSegura(url), target: "_blank", rel: "noopener", "aria-label": REDES[k].nome, title: REDES[k].nome }, [icone(REDES[k].icone)]));
      });
      if (redes.children.length) app.appendChild(redes);

      // Botões principais
      var lista = el("section", { class: "botoes" });
      var w = c.whatsapp || {};
      if (w.numero) {
        lista.appendChild(botao("whatsapp", "fa-brands fa-whatsapp", "Chamar no WhatsApp", "Resposta rápida",
          "https://wa.me/" + soDigitos(w.numero) + (w.mensagem ? "?text=" + encodeURIComponent(w.mensagem) : "")));
      }
      if (c.pix && c.pix.chave) {
        lista.appendChild(botao("pix", "fa-brands fa-pix", "Pagar com Pix", "QR Code e Copia e Cola", null, function () { abrirPix(c.pix); }));
      }
      var g = c.google || {};
      if (g.avaliar) lista.appendChild(botao("google", "fa-brands fa-google", "Avalie no Google", "Sua opinião ajuda muito ⭐", g.avaliar));
      if (g.maps)    lista.appendChild(botao("maps", "fa-solid fa-location-dot", "Como chegar", "Abrir no Google Maps", g.maps));
      if (g.perfil)  lista.appendChild(botao("google", "fa-brands fa-google", "Perfil no Google", "Horários, fotos e mais", g.perfil));
      if (c.email)   lista.appendChild(botao("email", "fa-solid fa-envelope", "Enviar e-mail", c.email, "mailto:" + c.email));
      if (c.telefone) lista.appendChild(botao("telefone", "fa-solid fa-phone", "Ligar", c.telefone, "tel:" + c.telefone.replace(/[^\d+]/g, "")));
      if (c.site)    lista.appendChild(botao("site", "fa-solid fa-globe", "Site", c.site.replace(/^https?:\/\//, ""), c.site));
      (c.extras || []).forEach(function (x) {
        if (x && x.url) lista.appendChild(botao("extra", x.icone || "fa-solid fa-link", x.titulo || x.url, x.subtitulo || "", x.url));
      });
      app.appendChild(lista);

      // Ações secundárias
      var acoes = el("section", { class: "acoes" });
      if (c.mostrarSalvarContato !== false) {
        acoes.appendChild(el("button", { class: "botao", type: "button", onclick: function () { salvarContato(c); } },
          [icone("fa-solid fa-address-book"), document.createTextNode("Salvar contato")]));
      }
      if (c.mostrarCompartilhar !== false) {
        acoes.appendChild(el("button", { class: "botao", type: "button", onclick: function () {
          var dados = { title: c.nome, text: "Confira os links de " + c.nome, url: location.href };
          if (navigator.share) navigator.share(dados).catch(function () {});
          else copiar(location.href, "Link copiado!");
        } }, [icone("fa-solid fa-share-nodes"), document.createTextNode("Compartilhar")]));
      }
      if (acoes.children.length) app.appendChild(acoes);

      app.appendChild(el("footer", { text: "© " + new Date().getFullYear() + " " + (c.nome || "") }));
    }

    // ---------- Carrega o cliente (?c=apelido -> clientes/apelido.json) ----------
    var apelido = new URLSearchParams(location.search).get("c");
    if (apelido && /^[a-z0-9_-]{1,60}$/i.test(apelido)) {
      fetch("clientes/" + apelido.toLowerCase() + ".json", { cache: "no-cache" })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(render)
        .catch(function () {
          document.getElementById("app").appendChild(el("p", { class: "erro", text: "Página não encontrada." }));
        });
    } else {
      render(window.CLIENTE);
    }

    // Exposto para testes no console
    window.gerarPix = gerarPix;
  })();
  </script>
</body>
</html>
