<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BruTeclas</title>
  <meta name="description" content="Chaveiros inteligentes com todos os seus links: redes sociais, WhatsApp, Pix e Google.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
  <style>
    :root { --cor: #7c3aed; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      font-family: "Poppins", system-ui, sans-serif; color: #f5f5f7; text-align: center;
      background: #0f0f14 radial-gradient(circle at 50% -10%, rgba(124, 58, 237, .45) 0, transparent 55%);
    }
    h1 { font-size: clamp(1.8rem, 6vw, 2.6rem); margin: 0 0 8px; }
    p { color: #b4b4c0; max-width: 460px; margin: 0 auto; line-height: 1.6; }
    .chave { font-size: 3rem; margin-bottom: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="chave" aria-hidden="true">🔑</div>
    <h1>BruTeclas</h1>
    <p>Chaveiros inteligentes: aproxime do celular e acesse redes sociais, WhatsApp, Pix e muito mais.</p>
  </main>
</body>
</html>
